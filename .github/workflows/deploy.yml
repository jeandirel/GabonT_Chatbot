# Déploiement manuel fullstack : FastAPI (Railway) + Next.js (Vercel)
# Ordre : teste → preprod → prod
#
# Secrets Actions :
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   RAILWAY_TOKEN          (account/project token)
#   RAILWAY_SERVICE_ID     (service API)
#   (optionnel) RAILWAY_ENVIRONMENT — défaut production

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement cible
        required: true
        type: choice
        options:
          - teste
          - preprod
          - prod
      skip_gate:
        description: Ignorer le contrôle de promotion (urgence uniquement)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

env:
  NODE_VERSION: "22"
  API_PUBLIC_URL: https://api-production-c0fd.up.railway.app

jobs:
  validate:
    name: Validate (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          MOOV_API_URL: ${{ env.API_PUBLIC_URL }}
          NEXT_PUBLIC_MOOV_API_URL: ${{ env.API_PUBLIC_URL }}

  gate:
    name: Promotion gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce teste → preprod → prod
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.inputs.target }}
          SKIP_GATE: ${{ github.event.inputs.skip_gate }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$SKIP_GATE" = "true" ]; then
            echo "::warning::Promotion gate skipped (skip_gate=true)"
            exit 0
          fi
          if [ "$TARGET" = "teste" ]; then
            echo "No upstream gate for teste"
            exit 0
          fi
          if [ "$TARGET" = "preprod" ]; then
            REQUIRED_ENV="teste"
          else
            REQUIRED_ENV="preprod"
          fi
          DEPLOY_ID=$(gh api "repos/${REPO}/deployments?environment=${REQUIRED_ENV}&per_page=10" \
            | jq -r --arg env "$REQUIRED_ENV" \
              '[.[] | select(.environment == $env)][0].id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            STATE=$(gh api "repos/${REPO}/deployments/${DEPLOY_ID}/statuses" \
              | jq -r '.[0].state // empty')
            if [ "$STATE" = "success" ]; then
              echo "Gate passed: ${REQUIRED_ENV} has a successful deployment"
              exit 0
            fi
          fi
          BRANCH_RUN=$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?branch=${REQUIRED_ENV}&status=success&per_page=5" \
            | jq -r '.workflow_runs[0].id // empty')
          if [ -n "$BRANCH_RUN" ]; then
            echo "Gate passed: successful Deploy run #${BRANCH_RUN} on ${REQUIRED_ENV}"
            exit 0
          fi
          echo "::error::Deploy '${REQUIRED_ENV}' successfully before '${TARGET}'."
          exit 1

  deploy-api:
    name: Deploy API (Railway)
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.inputs.target }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target }}

      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      - name: Deploy api/
        if: hashFiles('api/Dockerfile') != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        working-directory: api
        run: |
          set -euo pipefail
          export PATH="$HOME/.railway/bin:$PATH"
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "::warning::RAILWAY_TOKEN / RAILWAY_SERVICE_ID manquants — skip API deploy"
            exit 0
          fi
          railway up --service "$RAILWAY_SERVICE_ID" -y --ci

      - name: Smoke API health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -m 20 -o /tmp/h.json -w "%{http_code}" "${{ env.API_PUBLIC_URL }}/api/health" || echo 000)
            echo "attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/h.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::API health failed"
          exit 1

  deploy-web:
    name: Deploy Web (Vercel)
    needs: [deploy-api]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout ${{ github.event.inputs.target }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@41

      - name: Pull Vercel env
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ github.event.inputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN manquant"
            exit 1
          fi
          if [ "$TARGET" = "prod" ]; then ENV_NAME=production; else ENV_NAME=preview; fi
          vercel pull --yes --environment="$ENV_NAME" --token="$VERCEL_TOKEN"

      - name: Inject Moov API URL into build env
        env:
          API_URL: ${{ env.API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          # Ensure build-time public URL for CSP + Live WS
          {
            echo "MOOV_API_URL=${API_URL}"
            echo "NEXT_PUBLIC_MOOV_API_URL=${API_URL}"
          } >> .vercel/.env.preview.local 2>/dev/null || true
          {
            echo "MOOV_API_URL=${API_URL}"
            echo "NEXT_PUBLIC_MOOV_API_URL=${API_URL}"
          } >> .vercel/.env.production.local 2>/dev/null || true
          export MOOV_API_URL="$API_URL"
          export NEXT_PUBLIC_MOOV_API_URL="$API_URL"
          echo "MOOV_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_MOOV_API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ github.event.inputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MOOV_API_URL: ${{ env.API_PUBLIC_URL }}
          NEXT_PUBLIC_MOOV_API_URL: ${{ env.API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ github.event.inputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            vercel alias set "$URL" "gabon-t-chatbot-${TARGET}.vercel.app" --token="$VERCEL_TOKEN" || true
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed web ${TARGET} → ${URL}"

      - name: Smoke fullstack
        env:
          WEB_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -m 30 -o /tmp/st.json -w "%{http_code}" "${WEB_URL}/api/assistant/status" || echo 000)
          echo "assistant/status HTTP $CODE"
          cat /tmp/st.json || true
          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/st.json"))
          if not d.get("online"):
            print("::error::Frontend ne voit pas l'API Railway")
            sys.exit(1)
          print("OK online", d.get("api_url"), d.get("voice_mode"))
          PY
